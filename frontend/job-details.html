<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details — AgriSetu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container" style="padding-top: 36px; padding-bottom: 60px; max-width: 900px;">
    
    <div style="margin-bottom: 20px;">
      <a href="jobs.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">
        ← Back to Jobs Marketplace
      </a>
    </div>

    <div id="job-details-loading" style="text-align: center; padding: 60px 0; color: var(--color-text-secondary);">
      Loading job information...
    </div>

    <div id="job-details-card" class="card" style="display:none; box-shadow: var(--shadow-md);">
      
      <!-- Job Header -->
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--color-border); padding-bottom: 20px;">
        <div>
          <span id="detail-category" class="badge badge-info" style="margin-bottom: 8px;"></span>
          <h1 id="detail-title" style="color: var(--color-forest); font-size: 1.85rem; line-height: 1.25;"></h1>
          <p id="detail-farmer" style="color: var(--color-text-secondary); margin-top: 6px; font-weight: 500;"></p>
        </div>
        <div style="text-align: right;">
          <div id="detail-wage" style="font-size: 1.8rem; font-weight: 800; color: var(--color-primary);"></div>
          <span id="detail-status" class="badge"></span>
        </div>
      </div>

      <!-- Capacity & Vacancy Live Status -->
      <div style="background: var(--color-mint); border: 1px solid var(--color-border-green); border-radius: var(--radius-md); padding: 18px 22px; margin: 24px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; flex-wrap:wrap; gap:8px;">
          <span style="font-weight: 700; color: var(--color-forest); font-size: 1rem;">
            Worker Capacity Allocation
          </span>
          <span id="detail-vacancies-text" style="font-weight: 800; font-size: 1.05rem;"></span>
        </div>
        <div class="progress-bar" style="height: 10px;">
          <div id="detail-progress-fill" class="progress-fill"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 6px;">
          <span id="detail-confirmed-count">Confirmed: 0</span>
          <span id="detail-required-count">Required: 0</span>
        </div>
      </div>

      <!-- Key Details Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 28px;">
        <div class="card" style="padding: 14px; background: #F8FAFC;">
          <small style="color: var(--color-text-secondary); font-weight: 600;">📍 Location</small>
          <div id="detail-location" style="font-weight: 700; color: var(--color-text-main); margin-top: 4px;"></div>
        </div>

        <div class="card" style="padding: 14px; background: #F8FAFC;">
          <small style="color: var(--color-text-secondary); font-weight: 600;">📅 Work Schedule</small>
          <div id="detail-dates" style="font-weight: 700; color: var(--color-text-main); margin-top: 4px;"></div>
        </div>

        <div class="card" style="padding: 14px; background: #F8FAFC;">
          <small style="color: var(--color-text-secondary); font-weight: 600;">⏰ Hours</small>
          <div id="detail-hours" style="font-weight: 700; color: var(--color-text-main); margin-top: 4px;"></div>
        </div>

        <div class="card" style="padding: 14px; background: #F8FAFC;">
          <small style="color: var(--color-text-secondary); font-weight: 600;">⏳ Deadline</small>
          <div id="detail-deadline" style="font-weight: 700; color: var(--color-text-main); margin-top: 4px;"></div>
        </div>
      </div>

      <!-- Description -->
      <div style="margin-bottom: 28px;">
        <h3 style="color: var(--color-forest); margin-bottom: 10px;">Work Description</h3>
        <div id="detail-description" style="line-height: 1.7; color: var(--color-text-main); white-space: pre-line;"></div>
      </div>

      <!-- Provisions & Benefits -->
      <div style="margin-bottom: 28px;">
        <h3 style="color: var(--color-forest); margin-bottom: 12px;">Arrangements & Safety</h3>
        <div id="detail-provisions" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;"></div>
        <div id="detail-safety" style="background:#FEF3C7; border:1px solid #FCD34D; color:#92400E; padding:12px 16px; border-radius:var(--radius-md); font-size:0.92rem;"></div>
      </div>

      <!-- Contact Privacy Box -->
      <div class="card" style="border: 1px solid var(--color-border-green); background: #FAFCF8; margin-bottom: 28px;">
        <h4 style="color: var(--color-forest); margin-bottom: 6px;">📞 Farm Contact Details</h4>
        <div id="detail-contact-box" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
          <div>
            <span id="detail-phone" style="font-weight:700; font-size:1.1rem; color:var(--color-forest);"></span>
            <p id="detail-contact-notice" style="font-size:0.85rem; color:var(--color-text-secondary); margin-top:4px;"></p>
          </div>
          <div id="detail-call-button-container"></div>
        </div>
      </div>

      <!-- Action Footer -->
      <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid var(--color-border); padding-top: 20px; flex-wrap:wrap; gap:12px;">
        <button onclick="openReportModal()" class="btn btn-secondary btn-sm" style="color:var(--color-danger);">
          ⚠️ Report Issue
        </button>

        <div id="detail-actions" style="display:flex; gap:12px;"></div>
      </div>

    </div>

  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/jobs.js"></script>

  <script>
    let currentJob = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('id');
      if (!jobId) {
        window.location.href = 'jobs.html';
        return;
      }
      loadJobDetails(jobId);
    });

    async function loadJobDetails(jobId) {
      try {
        const res = await window.api.get(`/api/jobs/${jobId}`);
        if (res.success && res.data) {
          currentJob = res.data;
          renderDetails(res.data);
        }
      } catch (err) {
        document.getElementById('job-details-loading').innerHTML = `
          <div class="alert alert-danger">Failed to load job: ${escapeHtml(err.message)}</div>
        `;
      }
    }

    function renderDetails(job) {
      document.getElementById('job-details-loading').style.display = 'none';
      const card = document.getElementById('job-details-card');
      card.style.display = 'block';

      document.getElementById('detail-title').textContent = job.title;
      document.getElementById('detail-category').textContent = job.category;
      document.getElementById('detail-farmer').textContent = `Posted by: ${job.farmerName} ${job.farmName ? '• ' + job.farmName : ''}`;
      document.getElementById('detail-wage').textContent = `₹${job.wageAmount} ${job.wageBasis === 'DAILY' ? '/ day' : '/ hr'}`;

      const statusBadge = document.getElementById('detail-status');
      statusBadge.textContent = job.status;
      statusBadge.className = `badge ${job.status === 'PUBLISHED' ? 'badge-success' : 'badge-neutral'}`;

      // Vacancy Progress
      const percent = Math.min(100, Math.round((job.confirmedWorkers / job.requiredWorkers) * 100));
      const isFull = job.remainingVacancies <= 0;
      document.getElementById('detail-progress-fill').style.width = `${percent}%`;
      document.getElementById('detail-progress-fill').style.background = isFull ? 'var(--color-danger)' : 'var(--color-fresh)';
      document.getElementById('detail-vacancies-text').textContent = isFull ? 'FULLY STAFFED (0 Vacancies)' : `${job.remainingVacancies} Vacancies Remaining`;
      document.getElementById('detail-vacancies-text').style.color = isFull ? 'var(--color-danger)' : 'var(--color-forest)';
      document.getElementById('detail-confirmed-count').textContent = `Confirmed Workers: ${job.confirmedWorkers}`;
      document.getElementById('detail-required-count').textContent = `Total Required: ${job.requiredWorkers}`;

      // Metadata
      document.getElementById('detail-location').textContent = `${job.farmLocation}, ${job.village}, ${job.district}, ${job.state}`;
      document.getElementById('detail-dates').textContent = `${job.startDate} to ${job.endDate}`;
      document.getElementById('detail-hours').textContent = job.workingHours;
      document.getElementById('detail-deadline').textContent = job.applicationDeadline;
      document.getElementById('detail-description').textContent = job.description;

      // Provisions
      const provContainer = document.getElementById('detail-provisions');
      let provHtml = '';
      if (job.mealsProvided) provHtml += '<span class="badge badge-success">🍲 Meals Provided</span>';
      if (job.accommodationProvided) provHtml += '<span class="badge badge-success">🏠 Accommodation Provided</span>';
      if (job.transportationProvided) provHtml += '<span class="badge badge-success">🚜 Transport Arranged</span>';
      provContainer.innerHTML = provHtml || '<span style="color:var(--color-text-secondary); font-size:0.9rem;">No extra provisions specified</span>';

      const safetyBox = document.getElementById('detail-safety');
      if (job.safetyInstructions) {
        safetyBox.innerHTML = `⚠️ <strong>Safety Instructions:</strong> ${escapeHtml(job.safetyInstructions)}`;
        safetyBox.style.display = 'block';
      } else {
        safetyBox.style.display = 'none';
      }

      // Contact Privacy
      document.getElementById('detail-phone').textContent = job.farmerPhone;
      const callBtnContainer = document.getElementById('detail-call-button-container');
      const notice = document.getElementById('detail-contact-notice');

      if (job.contactVisible) {
        notice.textContent = '✓ You are authorized to contact this farmer directly.';
        callBtnContainer.innerHTML = `
          <a href="tel:${job.farmerPhone}" class="btn-contact">
            📞 Call Farmer (${job.farmerPhone})
          </a>
        `;
      } else {
        notice.textContent = '🔒 Phone number is protected. It will be revealed once your application is accepted by the farmer.';
        callBtnContainer.innerHTML = '';
      }

      // Action Buttons
      const actionsContainer = document.getElementById('detail-actions');
      const user = window.auth ? window.auth.getUser() : null;

      if (!user) {
        actionsContainer.innerHTML = `
          <a href="login.html?redirect=job-details.html?id=${job.id}" class="btn btn-primary">Login to Apply</a>
        `;
      } else if (user.id === job.farmerId) {
        actionsContainer.innerHTML = `
          <a href="manage-jobs.html" class="btn btn-secondary">Manage My Jobs</a>
          <a href="applications.html?jobId=${job.id}" class="btn btn-primary">Review Applications</a>
        `;
      } else if (user.role === 'LABOURER') {
        if (job.hasApplied) {
          actionsContainer.innerHTML = `
            <span class="badge badge-info" style="font-size:0.95rem; padding:8px 14px;">
              Application Status: ${job.myApplicationStatus}
            </span>
          `;
        } else if (isFull) {
          actionsContainer.innerHTML = `
            <button class="btn btn-secondary" disabled>Fully Staffed</button>
          `;
        } else {
          actionsContainer.innerHTML = `
            <button onclick="openApplyModal(${job.id}, '${escapeHtml(job.title)}')" class="btn btn-primary btn-lg">
              Apply for this Job
            </button>
          `;
        }
      }
    }

    function openReportModal() {
      if (!window.auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      const reason = prompt("Please enter the reason for reporting this job listing (e.g. misleading wage, safety hazard, spam):");
      if (reason && reason.trim()) {
        window.api.post('/api/reports', {
          jobId: currentJob.id,
          reason: 'Job Listing Report',
          details: reason.trim()
        }).then(() => {
          window.toast.success('Report submitted. Platform administrators have been notified.');
        }).catch(err => {
          window.toast.error(err.message || 'Failed to submit report');
        });
      }
    }
  </script>
</body>
</html>
