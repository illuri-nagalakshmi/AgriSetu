<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — AgriSetu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container" style="padding-top: 36px; padding-bottom: 60px; max-width: 820px;">
    
    <div class="dashboard-header">
      <div>
        <h1 class="dashboard-title">User Profile & Settings</h1>
        <p class="dashboard-subtitle">Manage personal information, privacy preferences, and agricultural details</p>
      </div>
    </div>

    <!-- Rating Summary Banner -->
    <div class="card" style="margin-bottom: 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; border-left: 4px solid var(--color-harvest-gold);">
      <div>
        <h3 id="prof-name" style="color:var(--color-forest); font-size:1.4rem;">User Name</h3>
        <p id="prof-role-badge" style="margin-top:4px;"></p>
      </div>
      <div style="text-align:right;">
        <div style="font-size:1.6rem; font-weight:800; color:var(--color-harvest-gold);" id="prof-rating-val">
          ★ 0.0
        </div>
        <small id="prof-reviews-count" style="color:var(--color-text-secondary);">0 reviews</small>
      </div>
    </div>

    <!-- Profile Edit Form -->
    <div class="card" style="box-shadow:var(--shadow-sm); margin-bottom: 32px;">
      <h3 style="color:var(--color-forest); margin-bottom: 20px;">Edit Profile Information</h3>
      
      <form id="profile-form" onsubmit="handleProfileUpdate(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-fullname" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email (Read-only)</label>
            <input type="email" id="prof-email" class="form-control" readonly style="background:#F1F5F9; cursor:not-allowed;">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="prof-phone" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Platform Language</label>
            <select id="prof-lang" class="form-control">
              <option value="en">English</option>
              <option value="te">తెలుగు (Telugu)</option>
              <option value="hi">हिन्दी (Hindi)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Village / Town</label>
            <input type="text" id="prof-village" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">District</label>
            <input type="text" id="prof-district" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input type="text" id="prof-state" class="form-control" required>
          </div>
        </div>

        <!-- Role Specific Fields -->
        <div id="farmer-profile-section" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-top:8px;">
          <h4 style="color:var(--color-forest); margin-bottom:12px;">👨‍🌾 Farm Details</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Farm / Estate Name</label>
              <input type="text" id="prof-farmname" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">Total Land (Acres)</label>
              <input type="number" step="0.1" id="prof-landacres" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Primary Crops Grown</label>
            <input type="text" id="prof-crops" class="form-control">
          </div>
        </div>

        <div id="labourer-profile-section" style="display:none; border-top:1px solid var(--color-border); padding-top:16px; margin-top:8px;">
          <h4 style="color:var(--color-forest); margin-bottom:12px;">🌾 Skills & Daily Rate</h4>
          <div class="form-group">
            <label class="form-label">Agricultural Skills</label>
            <input type="text" id="prof-skills" class="form-control">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Experience (Years)</label>
              <input type="number" id="prof-experience" class="form-control" min="0">
            </div>
            <div class="form-group">
              <label class="form-label">Expected Daily Wage (₹)</label>
              <input type="number" id="prof-wage" class="form-control">
            </div>
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; margin-top:20px;">
          <button type="submit" id="btn-save-profile" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>

    <!-- Reviews Received Section -->
    <div class="card">
      <h3 style="color:var(--color-forest); margin-bottom:16px;">Reviews & Feedback Received</h3>
      <div id="reviews-list" style="display:flex; flex-direction:column; gap:12px;">
        <div style="color:var(--color-text-secondary); text-align:center; padding:20px;">Loading reviews...</div>
      </div>
    </div>

  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let userProfile = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (!window.auth.requireAuth()) return;
      loadProfile();
    });

    async function loadProfile() {
      try {
        const res = await window.api.get('/api/users/profile');
        if (res.success && res.data) {
          userProfile = res.data;
          renderProfile(res.data);
          loadReviews(res.data.id);
        }
      } catch (err) {
        window.toast.error('Failed to load profile');
      }
    }

    function renderProfile(u) {
      document.getElementById('prof-name').textContent = u.fullName;
      document.getElementById('prof-role-badge').innerHTML = `<span class="user-badge-role">${u.role}</span>`;
      document.getElementById('prof-rating-val').textContent = `★ ${u.averageRating ? u.averageRating.toFixed(1) : '5.0'}`;
      document.getElementById('prof-reviews-count').textContent = `${u.totalReviews || 0} reviews received`;

      document.getElementById('prof-fullname').value = u.fullName;
      document.getElementById('prof-email').value = u.email;
      document.getElementById('prof-phone').value = u.phoneNumber;
      document.getElementById('prof-lang').value = u.preferredLanguage || 'en';
      document.getElementById('prof-village').value = u.village;
      document.getElementById('prof-district').value = u.district;
      document.getElementById('prof-state').value = u.state;

      if (u.role === 'FARMER') {
        document.getElementById('farmer-profile-section').style.display = 'block';
        if (u.farmerProfile) {
          document.getElementById('prof-farmname').value = u.farmerProfile.farmName || '';
          document.getElementById('prof-landacres').value = u.farmerProfile.totalLandAcres || '';
          document.getElementById('prof-crops').value = u.farmerProfile.primaryCrops || '';
        }
      } else if (u.role === 'LABOURER') {
        document.getElementById('labourer-profile-section').style.display = 'block';
        if (u.labourerProfile) {
          document.getElementById('prof-skills').value = u.labourerProfile.skills || '';
          document.getElementById('prof-experience').value = u.labourerProfile.experienceYears || '';
          document.getElementById('prof-wage').value = u.labourerProfile.expectedDailyWage || '';
        }
      }
    }

    async function loadReviews(userId) {
      const container = document.getElementById('reviews-list');
      try {
        const res = await window.api.get(`/api/reviews/user/${userId}`);
        if (res.success && res.data && res.data.length > 0) {
          container.innerHTML = res.data.map(r => `
            <div style="background:#F8FAFC; border:1px solid var(--color-border); border-radius:var(--radius-md); padding:14px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <strong>${escapeHtml(r.reviewerName)}</strong>
                <span style="color:var(--color-harvest-gold); font-weight:700;">${'★'.repeat(r.rating)} (${r.rating}/5)</span>
              </div>
              <p style="color:var(--color-text-main); font-size:0.92rem;">${escapeHtml(r.comment || 'No comment provided')}</p>
              <small style="color:var(--color-text-secondary); margin-top:4px; display:inline-block;">
                ${r.createdAt ? r.createdAt.substring(0, 10) : ''}
              </small>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color:var(--color-text-secondary); text-align:center;">No reviews received yet.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color:red;">Failed to load reviews.</p>';
      }
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save-profile');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const lang = document.getElementById('prof-lang').value;
      const payload = {
        fullName: document.getElementById('prof-fullname').value.trim(),
        phoneNumber: document.getElementById('prof-phone').value.trim(),
        preferredLanguage: lang,
        village: document.getElementById('prof-village').value.trim(),
        district: document.getElementById('prof-district').value.trim(),
        state: document.getElementById('prof-state').value.trim(),
        shareContactOnAccept: true,
        // Farmer
        farmName: document.getElementById('prof-farmname')?.value.trim() || null,
        totalLandAcres: document.getElementById('prof-landacres')?.value ? parseFloat(document.getElementById('prof-landacres').value) : null,
        primaryCrops: document.getElementById('prof-crops')?.value.trim() || null,
        // Labourer
        skills: document.getElementById('prof-skills')?.value.trim() || null,
        experienceYears: document.getElementById('prof-experience')?.value ? parseInt(document.getElementById('prof-experience').value) : 0,
        expectedDailyWage: document.getElementById('prof-wage')?.value ? parseFloat(document.getElementById('prof-wage').value) : null
      };

      try {
        const res = await window.api.put('/api/users/profile', payload);
        btn.disabled = false;
        btn.textContent = 'Save Changes';
        window.toast.success('Profile updated successfully!');
        if (window.i18n) window.i18n.setLanguage(lang);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
        window.toast.error(err.message || 'Failed to update profile');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
