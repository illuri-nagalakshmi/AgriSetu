<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AgriSetu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body style="background: var(--color-mint);">

  <div id="navbar-container"></div>

  <div class="container" style="max-width: 520px; padding-top: 48px; padding-bottom: 60px;">
    <div class="card" style="box-shadow: var(--shadow-lg); border-top: 5px solid var(--color-primary);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <img src="images/logo.svg" alt="AgriSetu" height="48" style="margin-bottom: 12px;">
        <h2 style="color: var(--color-forest);" data-i18n="login_title">Login to AgriSetu</h2>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem;">Connecting Farmers • Empowering Labourers</p>
      </div>

      <div id="login-error" class="alert alert-danger" style="display:none;"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="label_email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="label_password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" data-i18n="btn_login">
          Login
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <a href="register.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none;" data-i18n="no_account">
          Don't have an account? Register here
        </a>
      </div>

      <!-- Quick Demo Credentials Box for Evaluation -->
      <div style="margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--color-border);">
        <p style="font-size: 0.8rem; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; margin-bottom: 10px; text-align: center;">
          ⚡ Quick Demo Login (Click to Auto-fill)
        </p>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('ramesh.farmer@example.com', 'Password@123')">
            👨‍🌾 Farmer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('venkat.labourer@example.com', 'Password@123')">
            🌾 Labourer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('admin@agrisetu.org', 'Admin@123')">
            🛡️ Admin
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <script>
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const user = await window.auth.login(email, password);
        
        // Check redirect parameter
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        if (redirect && !redirect.includes('login.html')) {
          window.location.href = redirect;
        } else {
          if (user.role === 'FARMER') window.location.href = 'farmer-dashboard.html';
          else if (user.role === 'LABOURER') window.location.href = 'labourer-dashboard.html';
          else if (user.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
          else window.location.href = 'index.html';
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Login';
        errBox.textContent = err.message || 'Invalid email or password';
        errBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
