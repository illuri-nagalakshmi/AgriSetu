# ==============================================================================
# AgriSetu Backend Configuration
# ==============================================================================
spring.application.name=agrisetu-backend
server.port=8080

# ------------------------------------------------------------------------------
# Microsoft SQL Server Database Configuration
# ------------------------------------------------------------------------------
# Default: Windows Integrated Authentication on local SQLEXPRESS instance.
# To use SQL Server Authentication instead, set DB_URL, DB_USERNAME, and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=AgriSetuDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Settings
# ------------------------------------------------------------------------------
# Using 'update' allows Hibernate to keep tables synchronized with entities safely
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# Static Resources Configuration
# Serves the frontend/ directory so the app works seamlessly from http://localhost:8080/
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/
spring.web.resources.chain.cache=false

# ------------------------------------------------------------------------------
# Session & Security Settings
# ------------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.agrisetu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
