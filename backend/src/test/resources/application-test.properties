# ==============================================================================
# AgriSetu Test Configuration (H2 in MSSQL compatibility mode for automated tests)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:agrisetutest;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.com.agrisetu=INFO
